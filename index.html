<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Pedidos · WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #f2ebe3;
  --bg-gradient: radial-gradient(ellipse at top, rgba(196,165,116,0.12), transparent 55%),
                 linear-gradient(180deg, #f7f1ea 0%, #f2ebe3 40%, #ebe3d8 100%);
  --surface: #fffcf7;
  --surface-subtle: #faf6f0;
  --surface-active: #f3ebe3;
  --border: #ddd4c8;
  --border-focus: #c4a574;
  --text-main: #141414;
  --text-muted: #7a736c;
  --text-light: #a39e97;
  --gold: #c4a574;
  --gold-hover: #b08f5f;
  --gold-soft: rgba(196, 165, 116, 0.14);
  --accent: #8b1a2b;
  --accent-hover: #731322;
  --accent-soft: #f7e8eb;
  --accent-border: #e8c5cb;
  --success: #2f5d3a;
  --success-bg: #edf7f0;
  --danger: #8b1a2b;
  --danger-bg: #fef2f2;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-pill: 9999px;
  --shadow-sm: 0 2px 8px rgba(20, 20, 20, 0.04);
  --shadow-md: 0 8px 24px -4px rgba(20, 20, 20, 0.07);
  --shadow-lg: 0 16px 36px -6px rgba(20, 20, 20, 0.1);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Jost', system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-main);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  font-size: 0.9rem;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 1.25rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: 0 auto;
}

/* ── Encabezado Principal ── */
.app-header {
  text-align: center;
  margin-bottom: 1.4rem;
  position: relative;
  padding-top: 0.5rem;
}

.brand-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.65rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-main);
  line-height: 1.1;
}

.brand-subtitle {
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 0.35rem;
}


/* ── Tarjetas Generales ── */
.luxury-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-md);
  padding: 1.25rem;
  margin-bottom: 1rem;
  position: relative;
  overflow: visible;
  transition: border-color 0.2s;
}

/* ── Selector de Restaurantes ── */
.home-gold-line{
  width:48px;height:1px;background:var(--gold);
  margin:0.75rem auto 1.1rem;
}
.home-notice-bar{
  width:100%;max-width:620px;margin:0 auto 1rem;
  background:#1a1f2e;color:#e8e6e1;
  text-align:center;padding:0.55rem 0.75rem;
  font-size:0.78rem;font-weight:500;letter-spacing:0.02em;
  border-radius:var(--radius-pill);
}
.rest-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.65rem;
  margin-top: 0.9rem;
}
.rest-card-btn {
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0.85rem 0.4rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  box-shadow: var(--shadow-sm);
}
.rest-card-btn:hover {
  background: #fff;
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.rest-card-btn:hover .rest-card-name { color: var(--text-main); }
.rest-card-btn:active { transform: scale(0.98); }
.rest-initial { display: none !important; }
.rest-card-name {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-main);
  line-height: 1.25;
}

/* ── Barra de Navegación Interna ── */
.view-nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  padding-bottom: 0.85rem;
  border-bottom: 1px solid var(--border);
}

.nav-rest-badge {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-rest-title {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 1.5rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-main);
}

.btn-soft-back {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 0.4rem 0.85rem;
  border-radius: var(--radius-pill);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  transition: all 0.2s;
}

.btn-soft-back:hover {
  background: var(--text-main);
  color: #ffffff;
  border-color: var(--text-main);
}

/* ── Pestañas de Navegación ── */
.capsule-tabs {
  display: flex;
  gap: 0.45rem;
  margin-bottom: 1rem;
  padding: 0.25rem;
  background: rgba(0, 0, 0, 0.04);
  border-radius: var(--radius-pill);
}

.capsule-tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  padding: 0.55rem 0.75rem;
  border-radius: var(--radius-pill);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.capsule-tab-btn.active {
  background: #ffffff;
  color: var(--text-main);
  box-shadow: var(--shadow-sm);
}

.capsule-tab-btn.tab-accent {
  background: var(--accent);
  color: #ffffff;
}
.capsule-tab-btn.tab-accent.active {
  background: var(--accent);
  color: #ffffff;
}

/* ── Pestañas de Categoría (Scroll Suave) ── */
.sub-tabs-scroller {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding-bottom: 0.65rem;
  margin-bottom: 0.85rem;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-behavior: smooth;
}
.sub-tabs-scroller::-webkit-scrollbar {
  display: none;
}

.category-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 0.45rem 0.85rem;
  border-radius: var(--radius-pill);
  font-size: 0.74rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.category-pill:hover {
  border-color: var(--gold);
  color: var(--text-main);
}

.category-pill.active {
  background: var(--text-main);
  color: #ffffff;
  border-color: var(--text-main);
  scroll-margin-inline: 28px;
}

.category-badge-dot {
  background: var(--accent);
  color: #ffffff;
  font-size: 0.62rem;
  padding: 0.1rem 0.4rem;
  border-radius: var(--radius-pill);
  font-weight: 700;
}

/* ── Buscador ── */
.search-wrapper {
  display: flex;
  align-items: center;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 0.4rem 0.85rem;
  margin-bottom: 0.85rem;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.search-wrapper:focus-within {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-soft);
}

.search-icon {
  width: 16px;
  height: 16px;
  fill: var(--text-light);
  margin-right: 0.5rem;
  flex-shrink: 0;
}

.search-input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 0.86rem;
  color: var(--text-main);
}
.search-input::placeholder {
  color: var(--text-light);
}

.search-clear-btn {
  background: none;
  border: none;
  color: var(--text-light);
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0 0.3rem;
  line-height: 1;
}

/* ── Lista de Catálogo (Flujo Natural sin Saltos) ── */
.catalog-list {
  padding-right: 2px;
}

.catalog-item-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0.5rem;
  border-bottom: 1px solid rgba(0, 0, 0, 0.05);
  transition: background 0.15s;
  border-radius: var(--radius-sm);
}
.catalog-item-card:hover {
  background: rgba(197, 160, 89, 0.04);
}
.catalog-item-card:last-child {
  border-bottom: none;
}

.catalog-item-info {
  flex: 1;
  padding-right: 0.85rem;
}

.catalog-item-title {
  font-size: 0.86rem;
  font-weight: 500;
  color: var(--text-main);
  line-height: 1.25;
}

.catalog-item-cat {
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--gold-hover);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 0.15rem;
}

/* ── Stepper Táctil (+ / -) ── */
.stepper-control {
  display: flex;
  align-items: center;
  background: var(--surface-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 2px;
  gap: 2px;
}

.stepper-btn {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
}

.stepper-btn:hover {
  background: var(--text-main);
  color: #ffffff;
}
.stepper-btn:active {
  transform: scale(0.9);
}

.stepper-input {
  width: 36px;
  border: none;
  background: transparent;
  text-align: center;
  font-weight: 700;
  font-size: 0.86rem;
  color: var(--text-main);
  outline: none;
  padding: 0;
  -moz-appearance: textfield;
}
.stepper-input::-webkit-outer-spin-button,
.stepper-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.stepper-control.has-qty {
  background: var(--accent-soft);
  border-color: var(--accent-border);
}
.stepper-control.has-qty .stepper-input {
  color: var(--accent);
}
.stepper-control.has-qty .stepper-btn {
  color: var(--accent);
}
.stepper-control.has-qty .stepper-btn:hover {
  background: var(--accent);
  color: #ffffff;
}

/* ── Botón Flotante de Carrito / WhatsApp ── */
.floating-action-bar {
  position: fixed;
  bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 2rem);
  max-width: 580px;
  z-index: 999;
  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { opacity: 0; transform: translate(-50%, 15px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.floating-checkout-btn {
  width: 100%;
  background: linear-gradient(135deg, #1b633e 0%, #154c30 100%);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 0.95rem 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 12px 32px rgba(27, 99, 62, 0.35);
  cursor: pointer;
  font-size: 0.86rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  transition: transform 0.2s;
}
.floating-checkout-btn:active {
  transform: scale(0.98);
}
.floating-checkout-badge {
  background: rgba(255, 255, 255, 0.25);
  border-radius: var(--radius-pill);
  padding: 0.2rem 0.65rem;
  font-size: 0.78rem;
  font-weight: 700;
}

/* ── Formulario de Confirmación y Fecha ── */
.date-selector-luxury {
  display: flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: #ffffff;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-top: 0.35rem;
}
.date-day-pill {
  background: var(--surface-active);
  padding: 0.65rem 0.9rem;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-main);
  border-right: 1px solid var(--border);
  min-width: 90px;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.date-input-luxury {
  border: none;
  padding: 0.65rem 0.85rem;
  font-size: 0.88rem;
  font-weight: 600;
  outline: none;
  color: var(--text-main);
  background: transparent;
  flex: 1;
}

.luxury-textarea {
  width: 100%;
  padding: 0.75rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.84rem;
  outline: none;
  resize: vertical;
  background: #ffffff;
  color: var(--text-main);
  transition: border-color 0.2s;
}
.luxury-textarea:focus {
  border-color: var(--gold);
}

.btn-primary-wa {
  width: 100%;
  background: linear-gradient(135deg, #1f7a46 0%, #155731 100%);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-pill);
  padding: 0.95rem 1.25rem;
  font-weight: 600;
  font-size: 0.86rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(31, 122, 70, 0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.55rem;
  transition: all 0.2s;
  margin-top: 1rem;
}
.btn-primary-wa:hover {
  transform: translateY(-1px);
  box-shadow: 0 12px 28px rgba(31, 122, 70, 0.35);
}

.btn-danger-outline {
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 0.5rem 0.85rem;
  border-radius: var(--radius-pill);
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-danger-outline:hover {
  background: var(--danger-bg);
}

.cart-summary-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border);
}
.cart-item-title-col {
  display: flex;
  flex-direction: column;
}
.cart-item-main-name {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-main);
}
.cart-item-area-sub {
  font-size: 0.65rem;
  color: var(--gold-hover);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.toast-msg {
  border-radius: var(--radius-md);
  padding: 0.85rem 1.1rem;
  margin-bottom: 1rem;
  font-size: 0.82rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
  box-shadow: var(--shadow-sm);
}
.toast-msg.success {
  background: var(--success-bg);
  border: 1px solid #bce2c7;
  color: var(--success);
}
.toast-close {
  background: transparent;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: inherit;
  line-height: 1;
}

/* Modal Admin */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(28, 25, 23, 0.45);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}
.modal-box {
  background: #ffffff;
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

@media (max-width: 480px) {
  body {
    padding: 0.85rem 0.65rem 6.5rem;
  }
  .brand-title {
    font-size: 1.85rem;
  }
  .rest-grid { gap: 0.5rem; }
  .rest-card-btn { padding: 0.7rem 0.3rem; min-height: 44px; border-radius: 12px; }
  .rest-card-name { font-size: 0.65rem; }
}

.precheck-actions{
  display:flex;
  gap:0.65rem;
  align-items:center;
  margin:0 0 1.15rem;
  flex-wrap:wrap;
}
.btn-enviar-wa{
  flex:1 1 140px;
  background:var(--success);
  color:#fff;
  border:1px solid var(--success);
  border-radius:var(--radius-pill);
  padding:0.6rem 0.85rem;
  font-weight:600;
  font-size:0.72rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:opacity .15s, transform .15s;
  box-shadow:0 4px 14px rgba(47,93,58,0.22);
}
.btn-enviar-wa:hover{opacity:0.94}
.btn-borrar-pedido{
  flex:1 1 110px;
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
  border-radius:var(--radius-pill);
  padding:0.6rem 0.85rem;
  font-weight:600;
  font-size:0.72rem;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:background .15s;
}
.btn-borrar-pedido:hover{background:var(--accent-soft)}
.date-selector-luxury{
  display:flex;
  align-items:stretch;
  border:1px solid var(--border);
  border-radius:var(--radius-md);
  overflow:hidden;
  background:#fff;
  min-height:38px;
  box-shadow:var(--shadow-sm);
}
.date-day-pill{
  flex:0 0 auto;
  min-width:4.2rem;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--surface-subtle);
  border-right:1px solid var(--border);
  font-size:0.72rem;
  font-weight:700;
  color:var(--text-main);
  padding:0 0.45rem;
  text-transform:capitalize;
}
.date-input-luxury{
  flex:1;
  border:none;
  padding:0.35rem 0.5rem;
  font-size:0.8rem;
  min-height:36px;
  background:#fff;
  color:var(--text-main);
}
@media (max-width:480px){
  .btn-enviar-wa,.btn-borrar-pedido{
    padding:0.48rem 0.55rem;
    font-size:0.65rem;
    letter-spacing:0.04em;
  }
  .date-day-pill{min-width:3.6rem;font-size:0.62rem;padding:0 0.3rem}
  .date-input-luxury{font-size:0.75rem;min-height:34px;padding:0.28rem 0.4rem}
  .date-selector-luxury{min-height:34px}
  .precheck-actions{gap:0.45rem;margin-bottom:0.85rem}
}


.btn-volver-catalogo{
  display:block;
  width:100%;
  margin:0 0 0.75rem;
  background:transparent;
  border:none;
  color:var(--text-muted);
  font-size:0.78rem;
  font-weight:600;
  letter-spacing:0.04em;
  cursor:pointer;
  text-align:center;
  padding:0.35rem;
}
.btn-volver-catalogo:hover{color:var(--text-main);text-decoration:underline}


/* Congelar cabeceras estilo Excel (scroll de página) */
.view-nav-bar{
  position:sticky;
  top:0;
  z-index:40;
  background:var(--bg-main);
  background-image:var(--bg-gradient);
  margin:0 -0.15rem;
  padding:0.55rem 0.15rem 0.65rem;
  border-bottom:1px solid var(--border);
}
.capsule-tabs{
  position:sticky;
  top:52px;
  z-index:39;
  background:var(--bg-main);
  background-image:var(--bg-gradient);
  margin:0 -0.15rem 0.65rem;
  padding:0.35rem 0.15rem 0.45rem;
}
.catalog-sticky-top{
  position:sticky;
  top:108px;
  z-index:38;
  background:var(--surface);
  padding:0.45rem 0.35rem 0.5rem;
  margin:0 -0.35rem 0.35rem;
  border-bottom:1px solid var(--border);
  box-shadow:0 6px 14px -10px rgba(20,20,20,0.18);
}
.precheck-sticky{
  position:sticky;
  top:108px;
  z-index:38;
  background:var(--surface);
  padding:0.15rem 0.15rem 0.45rem;

function fmtD(d) {
  if (!d) return '';
  const p = d.split('-');
  return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : d;
}

function fechaConDia(iso) {
  if (!iso) return '';
  const p = String(iso).split('-');
  if (p.length !== 3) return iso;
  const dt = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(dt.getTime())) return fmtD(iso);
  const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
  return dias[dt.getDay()] + ' ' + p[2] + '/' + p[1] + '/' + p[0];
}

function soloDiaSemana(iso) {
  const s = fechaConDia(iso);
  return s ? s.split(' ')[0] : '—';
}

function tabToItemArea(tab) {
  if (tab === 'HELADOS' || tab === 'HELADOS+') return 'HELADOS';
  if (tab === 'COCINA') return 'COCINA';
  if (tab === 'PANADERIA') return 'PANADERIA';
  if (tab === 'ALCACHOFAS') return 'ALCACHOFAS';
  if (tab === 'CARNES' || tab === 'CARNES+') return 'CARNES';
  if (tab === 'VERDURAS' || tab === 'VERDURAS+') return 'VERDURAS';
  if (tab === 'BEBIDAS') return 'BEBIDAS';
  if (tab === 'POSTRES') return 'POSTRES';
  return 'OTROS';
}

function tabLabel(tab) {
  const map = {
    COCINA: 'Cocina', HELADOS: 'Helados', 'HELADOS+': 'Helados', PANADERIA: 'Panadería',
    OTROS: 'Otros', ALCACHOFAS: 'Alcachofas', CARNES: 'Carnes', 'CARNES+': 'Carnes',
    VERDURAS: 'Verduras', 'VERDURAS+': 'Verduras', BEBIDAS: 'Bebidas', POSTRES: 'Postres'
  };
  return map[tab] || tab;
}

function catalogTabs(cfg) {
  const order = ['COCINA','HELADOS+','HELADOS','PANADERIA','CARNES','CARNES+','VERDURAS','VERDURAS+','BEBIDAS','POSTRES','ALCACHOFAS','OTROS'];
  const keys = Object.keys(cfg.catalog || {});
  const tabs = order.filter(k => keys.includes(k));
  keys.forEach(k => { if (!tabs.includes(k)) tabs.push(k); });
  if (!tabs.includes('OTROS')) tabs.push('OTROS');
  return tabs;
}

function quitarNombreRest(name, rest) {
  let n = String(name || '').replace(/\s*\(C\)\s*$/i, '').trim();
  const keys = Object.keys(RESTAURANTS_CONFIG || {});
  keys.forEach(r => {
    if (!r) return;
    const esc = r.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    n = n.replace(new RegExp('\\s+' + esc + '(?=\\s|\\(|$)', 'ig'), '');
    n = n.replace(new RegExp('\\s*' + esc + '\\s*$', 'ig'), '');
  });
  n = n.replace(/\s+tenconten\b/ig, '');
  n = n.replace(/\s+/g, ' ').replace(/\s+\)/g, ')').replace(/\(\s+/g, '(').trim();
  return n || String(name || '').replace(/\s*\(C\)\s*$/i, '').trim();
}

function nombreCortoWA(name, area) {
  let n = quitarNombreRest(name, state.selRest);
  if ((area || '') === 'HELADOS') {
    n = n.replace(/^\s*helado\s+de\s+/i, '');
    n = n.replace(/^\s*helado\s+/i, '');
    n = n.replace(/^\s*sorbete\s+de\s+/i, '');
    n = n.replace(/^\s*sorbete\s+/i, '');
    if (n.length) n = n.charAt(0).toUpperCase() + n.slice(1);
  }
  return n;
}

function restDraftKey(rest) { return 'restDraft_' + (rest || state.selRest || ''); }

function persistRestDraft() {
  try {
    const rest = state.selRest;
    if (!rest) return;
    const payload = {
      cart: state.cart || [],
      deliveryDate: state.deliveryDate || '',
      entregaTarde: !!state.entregaTarde,
      orderNote: state.orderNote || '',
      metropolisPlanta: state.metropolisPlanta || '',
      restOrderPanel: state.restOrderPanel || 'CATALOGO'
    };
    localStorage.setItem(restDraftKey(rest), JSON.stringify(payload));
  } catch (e) {}
}

function loadRestDraft(rest) {
  try {
    const raw = localStorage.getItem(restDraftKey(rest));
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.cart) && d.cart.length) {
      state.cart = d.cart;
      state.deliveryDate = d.deliveryDate || state.deliveryDate || '';
      state.entregaTarde = !!d.entregaTarde;
      state.orderNote = d.orderNote || '';
      state.metropolisPlanta = d.metropolisPlanta || '';
      state.restOrderPanel = d.restOrderPanel || 'CATALOGO';
    }
  } catch (e) {}
}

function clearRestDraft(rest) {
  try { localStorage.removeItem(restDraftKey(rest || state.selRest)); } catch (e) {}
}

// ── ACTUALIZACIÓN RÁPIDA EN EL DOM (SIN SALTO DE PANTALLA) ──
function fastUpdateCatalogDOM(name, area) {
  const ci = state.cart.find(c => c.name === name && c.area === area);
  const currentQty = ci ? ci.qty : 0;
  
  // 1. Actualizar el input y la clase del producto exacto
  document.querySelectorAll('.catalog-item-card').forEach(card => {
    if (card.dataset.itemName === name && card.dataset.itemArea === area) {
      const input = card.querySelector('.stepper-input');
      const stepper = card.querySelector('.stepper-control');
      if (input) input.value = currentQty;
      if (stepper) stepper.classList.toggle('has-qty', currentQty > 0);
    }
  });

  // 2. Actualizar el indicador de la pestaña de categoría
  const totalInArea = state.cart.filter(c => c.area === area).reduce((s, i) => s + i.qty, 0);
  const tabBtn = document.querySelector(`.category-pill[data-tab-area="${area}"]`);
  if (tabBtn) {
    let dot = tabBtn.querySelector('.category-badge-dot');
    if (totalInArea > 0) {
      if (!dot) {
        dot = document.createElement('span');
        dot.className = 'category-badge-dot';
        tabBtn.appendChild(dot);
      }
      dot.textContent = totalInArea;
    } else if (dot) {
      dot.remove();
    }
  }

  // 3. Actualizar pestaña "Resumen"
  const totalCount = state.cart.filter(i => (Number(i.qty) || 0) > 0).length;
  const precheckTab = document.getElementById('tab-precheck-btn');
  if (precheckTab) {
    precheckTab.textContent = totalCount > 0 ? `🛒 Resumen (${totalCount})` : '🛒 Resumen';
    precheckTab.classList.toggle('tab-accent', totalCount > 0);
  }

  // 4. Actualizar barra flotante inferior
  let floatBar = document.getElementById('floating-bar');
  if (totalCount > 0) {
    if (!floatBar) {
      floatBar = document.createElement('div');
      floatBar.id = 'floating-bar';
      floatBar.className = 'floating-action-bar';
      floatBar.innerHTML = `
        <button type="button" class="floating-checkout-btn" onclick="state.restOrderPanel='PRECHECK';render()">
          <span class="floating-checkout-badge" id="float-badge">${totalCount} ${totalCount === 1 ? 'ítem' : 'ítems'}</span>
          <span>Revisar y Enviar Pedido →</span>
        </button>
      `;
      document.body.appendChild(floatBar);
    } else {
      floatBar.style.display = 'block';
      const badge = document.getElementById('float-badge');
      if (badge) badge.textContent = `${totalCount} ${totalCount === 1 ? 'ítem' : 'ítems'}`;
    }
  } else if (floatBar) {
    floatBar.style.display = 'none';
  }
}

function onCatalogSearch(el){
  state.searchQuery = el.value;
  const pos = el.selectionStart != null ? el.selectionStart : el.value.length;
  render();
  const restore = ()=>{
    const s = document.querySelector('input[data-search="catalog"]');
    if(!s) return;
    s.focus();
    try { s.setSelectionRange(pos, pos); } catch(e){}
  };
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      restore();
      setTimeout(restore, 10);
    });
  });
}
function updateCart(name, delta, areaOpt) {
  const area = (areaOpt != null && areaOpt !== '') ? areaOpt : tabToItemArea(state.activeTab);
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if (!ci && delta > 0) {
    state.cart.push({ name, qty: delta, area });
  } else if (ci) {
    ci.qty += delta;
    if (ci.qty <= 0) state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  } else if (!ci && delta < 0) {
    // no-op: no existe esa línea
  }
  persistRestDraft();

  if (state.restOrderPanel === 'CATALOGO') {
    fastUpdateCatalogDOM(name, area);
  } else {
    render();
  }
}

function setCartQty(name, area, raw) {
  let q = parseInt(raw, 10);
  if (isNaN(q) || q < 0) q = 0;
  let ci = state.cart.find(c => c.name === name && c.area === area);
  if (q <= 0) {
    state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  } else if (ci) {
    ci.qty = q;
  } else {
    state.cart.push({ name, qty: q, area });
  }
  persistRestDraft();

  if (state.restOrderPanel === 'CATALOGO') {
    fastUpdateCatalogDOM(name, area);
  } else {
    render();
  }
}

function setCartQtyFromTab(name, raw) {
  const area = tabToItemArea(state.activeTab);
  setCartQty(name, area, raw);
}

function removeFromCart(name, area) {
  if (area != null && area !== '') {
    state.cart = state.cart.filter(c => !(c.name === name && c.area === area));
  } else {
    state.cart = state.cart.filter(c => c.name !== name);
  }
  persistRestDraft();
  render();
}

function clearRestPedido() {
  if (!state.cart.length) return;
  if (!confirm('¿Deseas vaciar todo el pedido actual?')) return;
  state.cart = [];
  state.deliveryDate = '';
  state.entregaTarde = false;
  state.orderNote = '';
  state.metropolisPlanta = '';
  clearRestDraft(state.selRest);
  state.restOrderPanel = 'CATALOGO';
  render();
}

function addOtrosItem() {
  const nameInp = document.getElementById('otros-name');
  const qtyInp = document.getElementById('otros-qty');
  const name = (nameInp && nameInp.value || '').trim();
  let qty = parseInt(qtyInp && qtyInp.value) || 1;
  if (!name) {
    if (nameInp) nameInp.focus();
    return;
  }
  if (qty < 1) qty = 1;
  const existing = state.cart.find(c => c.area === 'OTROS' && c.name.toLowerCase() === name.toLowerCase());
  if (existing) existing.qty += qty;
  else state.cart.push({ name, qty, area: 'OTROS' });
  persistRestDraft();
  render();
}

// ── CONSTRUCTOR LIMPIO DE WHATSAPP (SIN CORONAS NI ICONOS FEB24) ──
function waGrupo(name, area){
  const rest = state.selRest || '';
  const map = (typeof WA_GRUPO_POR_REST !== 'undefined' && WA_GRUPO_POR_REST[rest]) || {};
  if(map[name]) return map[name];
  const a = String(area||'').toUpperCase();
  if(a === 'ALCACHOFAS' || (name||'').toLowerCase().includes('alcachofa')) return 'ALCACHOFAS';
  if(a === 'HELADOS' || a === 'HELADOS+') return 'HELADOS';
  if(a === 'PANADERIA') return 'PANADERIA';
  if(a === 'BEBIDAS') return 'BEBIDAS';
  if(a === 'POSTRES') return 'POSTRES';
  if(a === 'CARNES' || a === 'CARNES+') return a;
  return area || 'OTROS';
}
function buildWhatsAppOrderText() {
  const rest = state.selRest || '';
  const fecha = fechaConDia(state.deliveryDate);
  const planta = state.selRest === 'METROPOLIS' && state.metropolisPlanta ? ('\nPlanta: ' + state.metropolisPlanta) : '';
  const tarde = state.entregaTarde ? '. - POR LA TARDE' : '';
  let lines = [];
  lines.push('*PEDIDO ' + rest + '*');
  lines.push('Para: ' + fecha + tarde + planta);
  lines.push('');
  const byArea = {};
  (state.cart || []).forEach(i => {
    if (!i.qty) return;
    const a = i.area || 'OTROS';
    if (!byArea[a]) byArea[a] = [];
    byArea[a].push(i);
  });
  const orderAreas = ['COCINA','HELADOS','HELADOS+','PANADERIA','ALCACHOFAS','CARNES','CARNES+','BEBIDAS','POSTRES','OTROS'];
  orderAreas.forEach(a => {
    if (!byArea[a] || !byArea[a].length) return;
    lines.push('*' + a + '*');
    byArea[a].forEach(i => {
      lines.push(i.qty + ' × ' + nombreCortoWA(i.name, i.area || a));
    });
    lines.push('');
  });
  Object.keys(byArea).forEach(a => {
    if (orderAreas.includes(a)) return;
    lines.push('*' + a + '*');
    byArea[a].forEach(i => {
      lines.push(i.qty + ' × ' + nombreCortoWA(i.name, i.area || a));
    });
    lines.push('');
  });
  const nota = (state.orderNote || '').trim();
  if (nota) {
    lines.push('*NOTA*');
    lines.push(nota);
  }
  return lines.join('\n').trim();
}
function submitRestOrder(){
  if(!state.deliveryDate){
    const d=document.querySelector('input[type="date"]');
    if(d){d.style.borderColor='#b91c1c';d.style.boxShadow='0 0 0 3px rgba(185,28,28,.25)';d.focus();}
    alert('Indicá la fecha de entrega.');
    return;
  }
  if(!state.cart || !state.cart.length){ alert('No hay productos en el pedido'); return; }
  if(state.selRest==='METROPOLIS' && !state.metropolisPlanta){ alert('Elegí la planta'); return; }
  const text = buildWhatsAppOrderText();
  const url = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
  state.cart=[];
  state.deliveryDate='';
  state.entregaTarde=false;
  state.orderNote='';
  state.metropolisPlanta='';
  state.restOrderPanel='CATALOGO';
  clearRestDraft(state.selRest);
  state.authRest=true;
  state.successMessage='';
  render();
}


const app = document.getElementById('app');

function render() {
  const scrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
  let tabsScroll = 0;
  try{
    const sc = document.querySelector('.sub-tabs-scroller');
    if(sc) tabsScroll = sc.scrollLeft;
  }catch(e){}
  
  const oldFloat = document.getElementById('floating-bar');
  if (oldFloat) oldFloat.remove();

  app.innerHTML = '';
  if (!state.authRest) {
    renderRestaurantSelector();
  } else {
    renderRestaurantCatalog();
  }

  window.scrollTo(0, scrollY);
  requestAnimationFrame(() => {
    window.scrollTo(0, scrollY);
    try{
      const sc = document.querySelector('.sub-tabs-scroller');
      if(sc && tabsScroll) sc.scrollLeft = tabsScroll;
    }catch(e){}
    if(state.authRest && state.restOrderPanel === 'CATALOGO'){
      scrollActiveCategoryTabIntoView();
    }
  });
}

      Seleccione restaurante
    </p>
    <div class="rest-grid">

function entrarRest(r) {
  if (!RESTAURANTS_CONFIG[r]) return;
  state.selRest = r;
  state.authRest = true;
  state.cart = [];
  state.activeTab = 'COCINA';
  state.restOrderPanel = 'CATALOGO';
  loadRestDraft(r);
  render();
}

function salirRest() {
  state.cart = [];
  state.searchQuery = '';
  if(state.lockedRest){
    state.selRest = state.lockedRest;
    state.authRest = true;
    state.restOrderPanel = 'CATALOGO';
    state.activeTab = 'COCINA';
    render();
    return;
  }
  state.authRest = false;
  state.selRest = '';
  render();
}
